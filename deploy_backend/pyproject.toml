[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signbridge-ai-deploy-backend"
version = "0.1.0"
description = "Standalone deployable FastAPI API for SignBridge AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
]

[tool.setuptools]
py-modules = ["main"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signbridge-ai"
version = "0.1.0"
description = "Deployable FastAPI entrypoint for SignBridge AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "numpy>=1.26,<3.0",
  "Pillow>=10.4,<12.0",
  "PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

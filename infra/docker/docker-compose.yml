services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: signbridge
      POSTGRES_PASSWORD: signbridge
      POSTGRES_DB: signbridge
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../../.env.example
    depends_on: [postgres, redis]
    volumes:
      - ../../models:/models
      - ../../data:/data/signbridge
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    depends_on: [backend]
    ports:
      - "8080:80"
volumes:
  postgres-data:

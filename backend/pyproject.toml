[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signbridge-backend"
version = "0.1.0"
description = "FastAPI and AI inference services for SignBridge AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "numpy>=1.26,<3.0",
  "Pillow>=10.4,<12.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
ai = [
  "mediapipe>=0.10.14",
  "opencv-python>=4.10",
  "torch>=2.3",
  "openai-whisper>=20231117",
  "mlflow>=2.14",
  "onnx>=1.16",
]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
